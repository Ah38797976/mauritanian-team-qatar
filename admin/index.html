<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة — فريق الجالية الموريتانية في قطر</title>
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="القائمة الجانبية">
    <div class="side-brand"><span class="logo" role="img" aria-label="شعار الجالية الموريتانية في قطر"></span><div><b id="teamName"></b><small>لوحة الإدارة</small></div></div>
    <nav id="nav" aria-label="التنقل الرئيسي"></nav>
    <div class="side-foot"><a class="viewsite" id="viewSite" href="../" target="_blank" rel="noopener">عرض الموقع العام ↗</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="col">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="فتح القائمة" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button>
      <div class="crumb"><small>إدارة الفريق</small><b id="crumb"></b></div>
      <label class="who"><span>عرض بصفة</span><select id="userSel"></select></label>
    </header>
    <div class="demo-note" id="demoNote" role="note"><b>تنبيه:</b> البيانات هنا تجريبية ومحفوظة في ذاكرة الصفحة فقط. أي إضافة أو تعديل أو حذف يختفي عند تحديث الصفحة، وتعود البيانات الأصلية.</div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/publish.js"></script>
</body>
</html>
